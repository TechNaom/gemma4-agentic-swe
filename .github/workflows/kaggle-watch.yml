name: kaggle-watch

# Checks the Kaggle notebooks in ops/kaggle-watch.txt every 30 minutes. When a run finishes it saves the
# results under experiments/, commits them, and opens an issue with the summary (GitHub emails the owner).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: kaggle-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: pip install -q "kaggle>=1.8"

      - name: Check notebooks
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python scripts/kaggle_watch.py --report "$RUNNER_TEMP/report.md"

      - name: Commit results
        run: |
          git config user.name "Manohar Papasani"
          git config user.email "161720298+TechNaom@users.noreply.github.com"
          git add experiments ops/kaggle-watch-state.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: results from finished Kaggle run(s)"
          git push

      - name: Open issue with the summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$RUNNER_TEMP/report.md" ]; then echo "no new runs"; exit 0; fi
          gh issue create --title "Kaggle run finished ($(date -u +'%Y-%m-%d %H:%M') UTC)" \
            --body-file "$RUNNER_TEMP/report.md"
